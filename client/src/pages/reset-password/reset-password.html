<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Where Was I?</title>
  <link rel="stylesheet" href="./reset-password.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="panel image-panel login-panel">
      <div class="slide slide-1 slide-odd"></div>
      <div class="slide slide-2 slide-even"></div>
      <div class="slide slide-3 slide-odd"></div>
      <div class="slide slide-4 slide-even"></div>
      <div class="slide slide-5 slide-odd"></div>
      <div class="slide slide-6 slide-even"></div>
      <div class="overlay"></div>
    </div>

    <div class="panel form-panel">
      <div class="form-box">
        <h1 class="auth-title">Reset password</h1>
        <p class="auth-sub">Choose a new password for your account</p>
        <p class="auth-message" id="message"></p>

        <label class="field-label">New password</label>
        <input class="field-input" type="password" id="password" placeholder="••••••••" />

        <label class="field-label">Confirm password</label>
        <input class="field-input" type="password" id="confirm" placeholder="••••••••" />

        <button class="primary-btn" id="reset-btn">Reset password</button>

        <p class="switch-text">
          <span class="switch-link" id="back-link">← Back to login</span>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./reset-password.js"></script>
</body>
</html>

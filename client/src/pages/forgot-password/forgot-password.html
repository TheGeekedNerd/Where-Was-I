<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Where Was I?</title>
  <link rel="stylesheet" href="./forgot-password.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="panel image-panel login-panel">
      <div class="slide slide-1 slide-odd"></div>
      <div class="slide slide-2 slide-even"></div>
      <div class="slide slide-3 slide-odd"></div>
      <div class="slide slide-4 slide-even"></div>
      <div class="slide slide-5 slide-odd"></div>
      <div class="slide slide-6 slide-even"></div>
      <div class="overlay"></div>
    </div>

    <div class="panel form-panel">
      <div class="form-box">
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-sub">Enter your email and we'll send you a reset link</p>
        <p class="auth-message" id="message"></p>

        <label class="field-label">Email</label>
        <input class="field-input" type="email" id="email" placeholder="you@email.com" />

        <button class="primary-btn" id="submit-btn">Send reset link</button>

        <p class="switch-text">
          <span class="switch-link" id="back-link">← Back to login</span>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="./forgot-password.js"></script>
</body>
</html>
